# Render Blueprint for the Smart Barangay Request Form (Django backend).
# Deploy: push to GitHub, then on Render click "New +" -> "Blueprint" and pick this repo.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: smartbarangay-db
    plan: free            # free Postgres (expires after 90 days; upgrade to keep it)

services:
  - type: web
    name: smartbarangay
    runtime: python
    plan: free
    rootDir: BarangayPython/barangaypython
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: smartbarangay-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true        # Render generates a strong random key
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # Secrets below are NOT committed — set their values in the Render dashboard
      # (Environment tab) after the first deploy. sync:false keeps them blank here.
      - key: BASE_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
