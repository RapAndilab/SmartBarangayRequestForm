{% extends "web/base.html" %}
{% block title %}Register - Barangay E-Form{% endblock %}
{% block content %}
<h1>Create an Account</h1>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="grid2">
        <div>
            <label>First Name</label>
            <input type="text" name="first_name" value="{{ data.first_name|default:'' }}" required>
        </div>
        <div>
            <label>Last Name</label>
            <input type="text" name="last_name" value="{{ data.last_name|default:'' }}" required>
        </div>
        <div>
            <label>Date of Birth</label>
            <input type="date" name="birthdate" value="{{ data.birthdate|default:'' }}" required>
        </div>
        <div>
            <label>Gender</label>
            <select name="gender" required>
                <option value="">Select…</option>
                {% for g in genders %}
                    <option value="{{ g }}" {% if data.gender == g %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label>Phone Number</label>
            <input type="text" name="phone" value="{{ data.phone|default:'' }}" required>
        </div>
        <div>
            <label>Email</label>
            <input type="email" name="email" value="{{ data.email|default:'' }}" required>
        </div>
    </div>

    <label>Address</label>
    <input type="text" name="address" value="{{ data.address|default:'' }}" required>

    <div class="grid2">
        <div>
            <label>Username</label>
            <input type="text" name="username" value="{{ data.username|default:'' }}" required>
        </div>
        <div>
            <label>Profile Picture (optional)</label>
            <input type="file" name="image" accept="image/*">
        </div>
        <div>
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div>
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required>
        </div>
    </div>

    <button class="btn" type="submit">Register</button>
</form>
<p class="muted" style="text-align:center; margin-top:16px;">
    Already have an account? <a href="{% url 'web_login' %}">Login here</a>
</p>
{% endblock %}
