{% extends "web/base.html" %}
{% block title %}Request a Document - Barangay E-Form{% endblock %}
{% block content %}
<h1>Request a Document</h1>
<form method="POST">
    {% csrf_token %}
    <label>Document Type</label>
    <select name="document_type" required>
        <option value="">Select a document…</option>
        {% for value, label in document_types %}
            <option value="{{ value }}" {% if data.document_type == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>

    <label>Full Name</label>
    <input type="text" name="full_name" value="{{ data.full_name|default:'' }}" required>

    <label>Address</label>
    <input type="text" name="address" value="{{ data.address|default:'' }}" required>

    <div class="grid2">
        <div>
            <label>Date of Birth</label>
            <input type="text" name="birth_date" value="{{ data.birth_date|default:'' }}" placeholder="MM/DD/YYYY">
        </div>
        <div>
            <label>Place of Birth</label>
            <input type="text" name="birth_place" value="{{ data.birth_place|default:'' }}">
        </div>
        <div>
            <label>Civil Status</label>
            <input type="text" name="civil_status" value="{{ data.civil_status|default:'' }}" placeholder="e.g. Single, Married">
        </div>
        <div>
            <label>Citizenship</label>
            <input type="text" name="citizenship" value="{{ data.citizenship|default:'' }}" placeholder="e.g. Filipino">
        </div>
    </div>

    <label>Purpose</label>
    <textarea name="purpose" placeholder="e.g. Job application, travel, government requirement">{{ data.purpose|default:'' }}</textarea>

    <label>Years of Residency (if applicable)</label>
    <input type="text" name="years" value="{{ data.years|default:'' }}" placeholder="e.g. 5">

    <button class="btn" type="submit">Submit Request</button>
</form>
<p class="muted" style="text-align:center; margin-top:14px;">
    Your request will be reviewed by an admin before you can download the document.
</p>
{% endblock %}
